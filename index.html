<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<title>Soliq · 39–40-mavzular</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--g:#58fd76;--g2:#9dffb0;--w:#ffd36a;--tx:#eafff0;--mu:#9fc9aa;--red:#ff5c6c;
 --c0:#e2453c;--c1:#2f7de1;--c2:#e7a51b;--c3:#2aa84a}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#000;color:var(--tx);font-family:Inter,"Segoe UI",Roboto,"DejaVu Sans",sans-serif}
.mono{font-family:"JetBrains Mono","Consolas","DejaVu Sans Mono",monospace}
.hidden{display:none!important}
button{font-family:inherit}

/* ================= KATTA EKRAN ================= */
body.host{overflow:hidden;width:100vw;height:100vh}
#stage{position:absolute;left:0;top:0;width:1600px;height:900px;transform-origin:0 0;overflow:hidden;background:#000}
.s{position:absolute;inset:0;display:none}
.s.on{display:block}
.bg{position:absolute;inset:0;background-size:cover;background-position:center bottom}
canvas.live{position:absolute;left:0;bottom:0;width:1600px;height:894px}
.sh{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.85) 0%,rgba(0,0,0,.45) 20%,rgba(0,0,0,0) 36%,rgba(0,0,0,0) 80%,rgba(0,0,0,.6) 100%)}
.top{position:absolute;left:60px;right:60px;top:54px;max-width:1150px}
.kick{font-family:"JetBrains Mono","Consolas","DejaVu Sans Mono",monospace;font-size:26px;letter-spacing:.22em;color:var(--g);text-shadow:0 0 10px rgba(88,253,118,.6)}
#stage h1{font-size:80px;font-weight:800;line-height:1.04;margin-top:14px;min-height:104px;text-shadow:0 4px 30px rgba(0,0,0,.8)}
h1 .g{color:var(--g);text-shadow:0 0 24px rgba(88,253,118,.55)}
h1 .w{color:var(--w);text-shadow:0 0 24px rgba(255,211,106,.5)}
.sub{font-size:31px;color:var(--g2);margin-top:16px;max-width:1400px;line-height:1.3;text-shadow:0 2px 12px #000}
.bot{position:absolute;left:60px;right:60px;bottom:34px;display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end}
.chip{background:rgba(0,12,4,.6);border:1px solid rgba(88,253,118,.45);border-radius:12px;padding:10px 18px;font-size:25px;font-weight:700;box-shadow:0 0 24px rgba(88,253,118,.15);backdrop-filter:blur(4px)}
.chip small{display:block;font-size:19px;font-weight:500;color:var(--mu);margin-top:4px}
.chip.w{border-color:rgba(255,211,106,.7);box-shadow:0 0 24px rgba(255,211,106,.2)}
.src{position:absolute;left:70px;bottom:12px;font-family:"JetBrains Mono","Consolas","DejaVu Sans Mono",monospace;font-size:17px;color:#5f8f6b}
.dark{background:radial-gradient(ellipse at 50% 60%,#04230c 0%,#000 70%)}
.gold{background:radial-gradient(ellipse at 50% 70%,#2a1c00 0%,#000 72%)}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.thx{font-size:112px;font-weight:800;color:var(--g);text-shadow:0 0 34px rgba(88,253,118,.6);min-height:130px}
.thp{font-size:44px;color:var(--g2);margin-top:26px;max-width:1200px;line-height:1.4;min-height:62px}
.thg{font-size:54px;color:var(--w);margin-top:22px;font-weight:700;text-shadow:0 0 20px rgba(255,211,106,.5);min-height:70px}
.cur{display:inline-block;width:.5em;height:.82em;background:var(--g);margin-left:.06em;vertical-align:-.06em;box-shadow:0 0 14px var(--g)}
.g2{color:var(--g)}
canvas.rainbg{position:absolute;inset:0;opacity:.3}
.bars{position:absolute;left:70px;right:70px;top:420px;display:flex;flex-direction:column;gap:34px}
.br{display:grid;grid-template-columns:720px 1fr 320px;align-items:center;gap:26px;font-size:36px;font-weight:700}
.br .tr{height:46px;border-radius:10px;background:rgba(255,211,106,.08);overflow:hidden}
.br .tr i{display:block;height:100%;background:linear-gradient(90deg,#6b5520,#a0895a);transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.br b{white-space:nowrap;font-family:"JetBrains Mono","Consolas","DejaVu Sans Mono",monospace;font-size:50px;color:#d9c79a}
.br.hi span{color:var(--w)}.br.hi .tr i{background:linear-gradient(90deg,#c99a2b,#ffd36a);box-shadow:0 0 30px rgba(255,211,106,.6)}
.br.hi b{color:var(--w);text-shadow:0 0 20px rgba(255,211,106,.6)}
.banner{position:absolute;left:70px;right:70px;bottom:70px;font-size:38px;font-weight:700;color:var(--w);background:rgba(30,20,0,.75);border:1px solid rgba(255,211,106,.6);border-radius:16px;padding:18px 28px}
#fx{position:absolute;inset:0;z-index:50;pointer-events:none}

/* kalkulyator */
.calc{position:absolute;left:70px;right:70px;bottom:44px;background:rgba(0,10,3,.86);border:1px solid rgba(88,253,118,.6);border-radius:22px;padding:26px 36px;backdrop-filter:blur(4px)}
.calc .row{display:flex;align-items:center;gap:26px}
.calc .lab{font-size:28px;color:var(--mu);width:260px}
.calc input[type=range]{flex:1;height:14px;accent-color:#58fd76;cursor:pointer}
.calc .val{font-family:"JetBrains Mono","Consolas","DejaVu Sans Mono",monospace;font-size:54px;color:var(--tx);min-width:560px;text-align:right}
.calc .res{display:flex;align-items:baseline;justify-content:space-between;margin-top:14px;border-top:1px dashed rgba(88,253,118,.35);padding-top:16px}
.calc .res .f{font-size:34px;color:var(--mu)}
.calc .res .r{font-family:"JetBrains Mono","Consolas","DejaVu Sans Mono",monospace;font-size:92px;font-weight:700;color:var(--w);text-shadow:0 0 24px rgba(255,211,106,.6)}
.calc .res .r.zero{color:var(--g)}
.tog{display:inline-flex;align-items:center;gap:14px;font-size:28px;color:var(--tx);cursor:pointer;user-select:none;background:rgba(88,253,118,.08);border:1px solid rgba(88,253,118,.4);border-radius:40px;padding:10px 22px}
.tog i{width:58px;height:32px;border-radius:20px;background:#244;position:relative;transition:.3s}
.tog i:after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#cfe;transition:.3s}
.tog.on i{background:#2aa84a}.tog.on i:after{left:30px}
.calc .hint{font-size:22px;color:#5f8f6b;margin-top:8px}

/* dinamik ekranlar */
#dyn{position:absolute;inset:0;display:none;background:radial-gradient(ellipse at 50% 40%,#062a10 0%,#000 75%)}
#dyn.on{display:block;animation:fin .6s ease}
@keyframes fin{from{opacity:0}to{opacity:1}}
.lob{position:absolute;inset:0;display:grid;grid-template-columns:560px 1fr;gap:50px;padding:60px 70px}
.qrbox{background:#fff;border-radius:26px;padding:26px;width:500px;height:500px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 60px rgba(88,253,118,.35)}
.qrbox canvas,.qrbox img{width:448px!important;height:448px!important;image-rendering:pixelated}
.lob .url{font-family:"JetBrains Mono","Consolas","DejaVu Sans Mono",monospace;font-size:24px;color:var(--g2);margin-top:22px;word-break:break-all;width:500px}
.lob .code{font-size:34px;margin-top:10px;color:var(--mu)}.lob .code b{color:var(--w);font-size:48px;letter-spacing:.1em}
.lob h2{font-size:68px;font-weight:800;line-height:1.05}
.lob .cnt{font-size:40px;color:var(--g);margin:16px 0 22px}
.avs{display:flex;flex-wrap:wrap;gap:14px;align-content:flex-start;max-height:560px;overflow:hidden}
.avt{width:118px;text-align:center;animation:popin .6s cubic-bezier(.2,1.6,.4,1)}
.avt img{width:96px;height:96px;object-fit:contain;animation:bob 2.4s ease-in-out infinite;transform-origin:50% 100%}
.avt span{display:block;font-size:19px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes popin{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-4%) rotate(-2deg)}50%{transform:translateY(0)}75%{transform:translateY(-3%) rotate(2deg)}}
.vidok{position:absolute;right:24px;bottom:16px;font-size:16px;color:#3f7a4c}

.qv{position:absolute;inset:0;padding:50px 70px}
.qv .qn{font-family:"JetBrains Mono","Consolas","DejaVu Sans Mono",monospace;font-size:26px;letter-spacing:.2em;color:var(--g)}
.qv .qt{font-size:62px;font-weight:800;line-height:1.15;margin-top:18px;max-width:1220px;min-height:150px}
.timer{position:absolute;right:70px;top:46px;width:150px;height:150px}
.timer svg{width:150px;height:150px;transform:rotate(-90deg)}
.timer b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:60px;font-weight:800}
.ans{position:absolute;left:70px;right:70px;bottom:150px;display:grid;grid-template-columns:1fr 1fr;gap:22px}
.op{position:relative;border-radius:18px;padding:26px 30px 26px 100px;font-size:38px;font-weight:700;min-height:130px;display:flex;align-items:center;transition:opacity .5s,transform .5s,filter .5s;line-height:1.2}
.op .sh2{position:absolute;left:30px;top:50%;transform:translateY(-50%);font-size:46px;opacity:.9}
.op .ct{position:absolute;right:26px;top:50%;transform:translateY(-50%);font-family:"JetBrains Mono","Consolas","DejaVu Sans Mono",monospace;font-size:44px;opacity:0}
.op0{background:var(--c0)}.op1{background:var(--c1)}.op2{background:var(--c2)}.op3{background:var(--c3)}
.rev .op{opacity:.28;filter:grayscale(.6)}
.rev .op.ok{opacity:1;filter:none;transform:scale(1.03);box-shadow:0 0 0 5px #fff,0 0 50px rgba(255,255,255,.4)}
.rev.vote .op{opacity:1;filter:none}
.rev .op .ct{opacity:1}
.qv .cnt2{position:absolute;left:70px;bottom:44px;font-size:30px;color:var(--mu)}
.qv .xp{position:absolute;left:70px;right:70px;bottom:36px;font-size:36px;color:var(--w);font-weight:700}

.lb{position:absolute;inset:0;padding:60px 120px}
.lb h2{font-size:76px;font-weight:800;text-align:center}
.lbr{display:grid;grid-template-columns:90px 110px 1fr 220px;align-items:center;gap:20px;font-size:44px;font-weight:700;background:rgba(88,253,118,.07);border:1px solid rgba(88,253,118,.25);border-radius:18px;padding:10px 30px;margin-top:18px;animation:slin .7s cubic-bezier(.2,.9,.2,1) both}
.lbr img{width:90px;height:90px;object-fit:contain}
.lbr .sc{text-align:right;font-family:"JetBrains Mono","Consolas","DejaVu Sans Mono",monospace;color:var(--w)}
.lbr .rk{color:var(--g);font-family:"JetBrains Mono","Consolas","DejaVu Sans Mono",monospace}
@keyframes slin{from{transform:translateX(-80px);opacity:0}to{transform:none;opacity:1}}
.pod{display:flex;justify-content:center;align-items:flex-end;gap:40px;margin-top:60px;height:640px}
.pc{width:330px;text-align:center;animation:rise 1s cubic-bezier(.2,.9,.2,1) both}
.pc img{width:190px;height:190px;object-fit:contain;animation:joy .7s ease-in-out infinite;filter:drop-shadow(0 0 20px rgba(255,211,106,.6))}
.pc .nm{font-size:40px;font-weight:800;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc .pt{font-family:"JetBrains Mono","Consolas","DejaVu Sans Mono",monospace;font-size:34px;color:var(--w)}
.pc .blk{margin-top:14px;border-radius:18px 18px 0 0;background:linear-gradient(180deg,rgba(255,211,106,.45),rgba(255,211,106,.05));font-size:90px;font-weight:900;color:#fff;display:flex;align-items:flex-start;justify-content:center;padding-top:16px}
@keyframes rise{from{transform:translateY(200px);opacity:0}to{transform:none;opacity:1}}
@keyframes joy{0%,100%{transform:translateY(0) rotate(-8deg) scale(1.05)}50%{transform:translateY(-14%) rotate(8deg) scale(1.12)}}
.others{display:flex;justify-content:center;gap:28px;margin-top:20px;font-size:28px;color:var(--mu)}

#black{position:absolute;inset:0;background:#000;z-index:90;display:none}
#qrov{position:absolute;inset:0;z-index:85;display:none;align-items:center;justify-content:center;background:rgba(0,6,2,.82);backdrop-filter:blur(4px)}
#qrov.on{display:flex;animation:fin .4s ease}
.qrbig{text-align:center}
#qrb{background:#fff;border-radius:26px;padding:26px;display:inline-block;box-shadow:0 0 70px rgba(88,253,118,.45)}
#qrb canvas,#qrb img{width:560px!important;height:560px!important;image-rendering:pixelated}
.qrt{margin-top:22px;font-size:34px;color:#9fc9aa}.qrt b{color:#ffd36a;font-size:46px;letter-spacing:.1em}
.ends{position:absolute;inset:0;animation:fin 2s ease}
.ends .bg{background-size:cover;background-position:center bottom;filter:brightness(.95)}
.ends .bg.shk{animation:shake2 .1s linear infinite;filter:brightness(1.2)}
.ends.out{opacity:0;transition:opacity 1.6s}
#endph{position:absolute;left:50%;top:50%;width:640px;transform:translate(-50%,-50%) scale(.9);opacity:0;transition:opacity 1.6s,transform 1.6s;z-index:5;filter:drop-shadow(0 0 40px rgba(88,253,118,.35))}
#endph img{width:100%;border-radius:20px;-webkit-mask-image:radial-gradient(ellipse at 50% 50%,#000 45%,transparent 72%);mask-image:radial-gradient(ellipse at 50% 50%,#000 45%,transparent 72%)}
#endph.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#endph.rng img{animation:shake2 .1s linear infinite}
@keyframes shake2{0%{transform:translate(-4px,1px) rotate(-1deg)}50%{transform:translate(4px,-1px) rotate(1deg)}100%{transform:translate(-4px,1px) rotate(-1deg)}}
#endph.out{opacity:0;transform:translate(-50%,-50%) scale(1.15);transition:opacity 3s,transform 3s}
#topbar{position:absolute;left:30px;right:30px;top:14px;z-index:30;display:none;align-items:center;gap:18px;font-family:"JetBrains Mono","Consolas","DejaVu Sans Mono",monospace;font-size:20px;color:#9fc9aa;pointer-events:none}
#topbar .pr{flex:1;height:3px;background:rgba(88,253,118,.12);border-radius:2px;overflow:hidden}#topbar .pr i{display:block;height:100%;background:linear-gradient(90deg,#1f8f3a,#58fd76);transition:width .8s}
#topbar .live{color:#58fd76}#topbar .live:before{content:"●";margin-right:8px;animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
#mini{position:absolute;right:20px;bottom:16px;z-index:30;display:none;flex-direction:column;align-items:center;gap:4px;background:rgba(0,10,3,.75);border:1px solid rgba(88,253,118,.3);border-radius:12px;padding:6px 6px 5px;font-family:"JetBrains Mono","Consolas","DejaVu Sans Mono",monospace;font-size:14px;color:#9fc9aa;text-align:center;line-height:1.15}
#mini .mq{width:72px;height:72px;background:#fff;border-radius:6px;padding:4px}#mini .mq canvas,#mini .mq img{width:64px!important;height:64px!important}
#mini b{color:#ffd36a;font-size:18px}
#ctl{position:absolute;right:24px;bottom:20px;z-index:95;display:flex;gap:10px;opacity:0;transform:translateY(12px);transition:opacity .4s,transform .4s;pointer-events:none}
#ctl.show{opacity:1;transform:none;pointer-events:auto}
#ctl button{font:700 22px Inter,"Segoe UI",sans-serif;height:58px;min-width:58px;padding:0 16px;border-radius:14px;border:1px solid rgba(88,253,118,.4);background:rgba(0,14,5,.85);color:#eafff0;cursor:pointer}
#ctl button.nx{background:linear-gradient(180deg,#6dff88,#2fbf52);color:#03200b;border:0;min-width:170px;font-size:26px;box-shadow:0 0 24px rgba(88,253,118,.45)}
#ctl button:hover{filter:brightness(1.15)}
.copy{position:absolute;right:40px;top:30px;font:600 20px Inter,"Segoe UI",sans-serif;padding:12px 20px;border-radius:12px;border:1px solid rgba(88,253,118,.4);background:rgba(0,14,5,.8);color:#9fc9aa;cursor:pointer}
.playw{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px}
.playb{font:800 64px Inter,"Segoe UI",sans-serif;padding:34px 80px;border-radius:24px;border:0;cursor:pointer;color:#03200b;background:linear-gradient(180deg,#8dffa2,#2fbf52);box-shadow:0 10px 0 #1a7a33,0 0 70px rgba(88,253,118,.55);animation:pulse 2s ease-in-out infinite}
.playb.off{background:#163;color:#9fc9aa;box-shadow:none;animation:none;font-size:40px}
@keyframes pulse{50%{box-shadow:0 10px 0 #1a7a33,0 0 110px rgba(88,253,118,.8);transform:scale(1.03)}}
.skip{position:absolute;left:40px;bottom:34px;font:600 22px Inter,"Segoe UI",sans-serif;padding:12px 22px;border-radius:12px;border:1px solid rgba(88,253,118,.35);background:transparent;color:#9fc9aa;cursor:pointer}
#mus{position:absolute;left:30px;top:30px;z-index:60;display:none;align-items:center;gap:14px;background:rgba(0,10,3,.75);border:1px solid rgba(88,253,118,.35);border-radius:16px;padding:12px 18px;font:600 20px Inter,"Segoe UI",sans-serif;color:#eafff0}
#mus button{width:50px;height:50px;border-radius:50%;border:2px solid #9fc9aa;background:transparent;color:#fff;font-size:20px;cursor:pointer}
#mus input{width:110px;accent-color:#58fd76}
#video{position:absolute;inset:0;width:100%;height:100%;background:#000;z-index:40;display:none;object-fit:contain}
.ihint{position:absolute;left:0;right:0;bottom:30px;text-align:center;font-size:20px;color:#2c5a37}

/* PIN / tarix */
.ov{position:fixed;inset:0;background:rgba(0,6,2,.97);z-index:200;overflow:auto;color:var(--tx)}
.pinbox{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);text-align:center}
.pinbox input{font:700 40px monospace;width:260px;text-align:center;padding:14px;border-radius:14px;border:2px solid var(--g);background:#02140a;color:#fff;letter-spacing:.3em}
.pinbox p{margin-top:14px;color:var(--mu)}
.hist{max-width:1300px;margin:0 auto;padding:30px 30px 80px;font-size:16px}
.hist h2{font-size:30px;margin-bottom:6px}
.hist .bt{font-weight:600;font-size:15px;padding:9px 16px;border-radius:10px;border:1px solid var(--g);background:#04160a;color:#eafff0;cursor:pointer;margin:4px 6px 4px 0}
.hist .bt.sel{background:#1c5a2b}
.hist table{border-collapse:collapse;width:100%;margin-top:12px}
.hist th,.hist td{border-bottom:1px solid #18381f;padding:7px 8px;text-align:left;vertical-align:middle}
.hist th{color:var(--mu);font-weight:600;font-size:14px;white-space:nowrap}
.hist td{white-space:nowrap}.hist td.muted{white-space:normal}
.hist td img{width:38px;height:38px;object-fit:contain;vertical-align:middle}
.hist .card{background:#04160a;border:1px solid #1c4426;border-radius:14px;padding:16px 18px;margin-top:16px}
.hist .bar{height:12px;background:#58fd76;border-radius:6px;display:inline-block;vertical-align:middle}
.hist .muted{color:var(--mu)}
.hist .up{color:#58fd76}.hist .dn{color:#ff8a8a}
.fbitem{padding:8px 0;border-bottom:1px dashed #1c4426}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0a2a12;border:1px solid var(--g);border-radius:12px;padding:10px 18px;z-index:300;font-size:16px}

/* ================= TELEFON ================= */
body.ph{min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#0b3317 0%,#020a04 62%) fixed;overflow-x:hidden}
#ph{max-width:540px;margin:0 auto;padding:18px 14px 30px;min-height:100vh;display:flex;flex-direction:column}
.ph h2{font-size:24px;text-align:center;margin-top:6px}
.ph .muted{color:var(--mu);text-align:center;font-size:15px;margin-top:6px}
.inp{width:100%;font-weight:600;font-size:20px;padding:14px 16px;border-radius:14px;border:1.5px solid rgba(88,253,118,.5);background:#03140a;color:#fff;margin-top:14px;outline:none}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:14px}
.av{position:relative;aspect-ratio:1;border-radius:14px;background:rgba(88,253,118,.06);border:1.5px solid rgba(88,253,118,.18);display:flex;align-items:flex-end;justify-content:center;cursor:pointer}
.av img{width:96%;height:96%;object-fit:contain;animation:bob 2.4s ease-in-out infinite;transform-origin:50% 100%;pointer-events:none}
.av.taken{opacity:.25;pointer-events:none}
.av.sel{border-color:#58fd76;background:rgba(88,253,118,.2);box-shadow:0 0 22px rgba(88,253,118,.5)}
.av.sel img{animation:dance .7s ease-in-out infinite}
@keyframes dance{0%,100%{transform:translateY(0) rotate(-6deg) scale(1.08)}50%{transform:translateY(-12%) rotate(6deg) scale(1.15)}}
.btn{display:block;width:100%;font-weight:800;font-size:20px;padding:16px;border-radius:14px;border:0;background:#58fd76;color:#03200b;cursor:pointer;margin-top:16px}
.btn:disabled{opacity:.35}
.err{color:var(--red);text-align:center;margin-top:10px;font-weight:600}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.hero .big{font-size:30px;font-weight:800;line-height:1.2}
.hero .fact{font-size:20px;color:var(--g2);line-height:1.4;max-width:420px}
.dim{opacity:.75}
.me{position:relative;width:150px;height:150px;margin:0 auto}
.me img{width:100%;height:100%;object-fit:contain;animation:bob 2.4s ease-in-out infinite;transform-origin:50% 100%}
.me .bub{position:absolute;right:-30px;top:-14px;font-size:44px}
.me.happy img{animation:joy .55s ease-in-out infinite!important;filter:drop-shadow(0 0 16px #ffd36a)}
.me.sad img{animation:sad 2.6s ease-in-out infinite!important;filter:grayscale(.75) brightness(.7)}
@keyframes sad{0%,100%{transform:translateY(6%) rotate(-3deg) scaleY(.94)}50%{transform:translateY(9%) rotate(3deg) scaleY(.9)}}
.me .bub{animation:bubk 2s ease-in-out infinite}
@keyframes bubk{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.tear{position:absolute;left:44%;top:34%;width:8px;height:12px;background:#7cc7ff;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;display:none}
.me.sad .tear{display:block;animation:tear 1.3s ease-in infinite}
@keyframes tear{0%{transform:translateY(0);opacity:1}100%{transform:translateY(44px);opacity:0}}
.spark{position:fixed;pointer-events:none;font-size:24px;animation:fly 1.2s ease-out forwards;z-index:50}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}
.pbar{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--mu);padding:4px 2px 10px}
.pbar img{width:34px;height:34px;object-fit:contain}
.pbar b{color:var(--tx)}.pbar .sp{flex:1}.pbar .pts{color:var(--w);font-weight:800}
.pq{font-size:21px;font-weight:700;text-align:center;line-height:1.3;margin:6px 0 12px}
.pbtns{display:grid;grid-template-columns:1fr;gap:10px;flex:1}
.pb{border:0;border-radius:16px;color:#fff;font-weight:700;font-size:19px;padding:14px 14px 14px 58px;text-align:left;position:relative;min-height:66px;cursor:pointer;line-height:1.25}
.pb .s{position:absolute;left:18px;top:50%;transform:translateY(-50%);font-size:26px;display:block}
.pb:active{transform:scale(.98)}
.pb.p0{background:var(--c0)}.pb.p1{background:var(--c1)}.pb.p2{background:var(--c2)}.pb.p3{background:var(--c3)}
.pb.dim{opacity:.35}.pb.mine{box-shadow:0 0 0 4px #fff}
.ptim{height:8px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden;margin-bottom:12px}
.ptim i{display:block;height:100%;background:var(--g);width:100%}
.ring{font-size:84px;animation:shake .12s linear infinite}
@keyframes shake{0%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}100%{transform:rotate(-14deg)}}
canvas#prain{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;transition:opacity 1s}
#ph{position:relative;z-index:1}
.look{font-family:"JetBrains Mono","Consolas","DejaVu Sans Mono",monospace;font-size:22px;font-weight:700;letter-spacing:.12em;color:#58fd76;text-shadow:0 0 14px rgba(88,253,118,.9),0 0 30px rgba(88,253,118,.5);min-height:30px;margin-top:10px;white-space:pre-wrap;text-align:center}
.look.big2{font-size:28px}
.ph .hero.glass{background:rgba(2,10,4,.55);border-radius:22px;padding:20px 14px;backdrop-filter:blur(2px)}
.rate{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.rate button{flex:1;font-size:40px;padding:12px 0;border-radius:16px;border:1.5px solid rgba(88,253,118,.3);background:#03140a;cursor:pointer}
.rate button.sel{border-color:#58fd76;background:rgba(88,253,118,.22);transform:scale(1.08)}
textarea.inp{min-height:110px;resize:vertical;font-size:17px}
.rk{font-size:56px;font-weight:900;color:var(--w)}
.cloud{font-size:44px;position:absolute;left:50%;top:-40px;transform:translateX(-50%);animation:bubk 2.6s ease-in-out infinite}

let calcV=8e9, calcFree=false;
function calcInit(){ const sl=$("#s5"); const r=$("#crng",sl); const lo=Math.log(1e8), hi=Math.log(5e10);
  r.value=Math.round((Math.log(calcV)-lo)/(hi-lo)*1000);
  const upd=()=>{ const raw=Math.exp(lo+(hi-lo)*r.value/1000); const nice=[1e8,2e8,5e8,1e9,2e9,5e9,8e9,1e10,2e10,5e10]; let v=raw; const step=raw<1e9?1e8:raw<1e10?5e8:1e9; v=Math.round(raw/step)*step; nice.forEach(x=>{ if(Math.abs(x-raw)/x<.04) v=x; }); calcV=v;
    $("#cval").textContent=fmt(v)+" soʻm"; const res=$("#cres"); if(calcFree){ res.textContent="0 soʻm"; res.classList.add("zero"); $("#cfor").textContent="Imtiyozli korxona — soliqdan ozod"; }
    else { res.textContent=fmt(v*0.015)+" soʻm"; res.classList.remove("zero"); $("#cfor").textContent=fmt(v)+" × 1,5% ="; } };
  r.oninput=upd; $("#ctog").onclick=()=>{ calcFree=!calcFree; $("#ctog").classList.toggle("on",calcFree); upd(); }; upd(); window.__calcUpd=upd; }

async function loadHist(){ const out={};

  return Object.values(out).sort((a,b)=>b.sid.localeCompare(a.sid)); }
const norm=s=>String(s||"").toLowerCase().replace(/[ʻʼ'`‘’]/g,"").replace(/\s+/g," ").trim();
function analyse(sess,all){ const graded=[...Array(10).keys()].filter(i=>!Q[i].vote&&i<=sess.upto);
  const rows=Object.values(sess.P).map(p=>{ let ok=0,ans=0,ms=0,msn=0; const weak=[];
    for(let i=0;i<=sess.upto;i++){ const a=p.a[i]; if(a){ ans++; } if(Q[i].vote) continue; if(a&&a[2]){ ok++; ms+=a[1]; msn++; } else weak.push(TOPIC[i]); }
    const prev=all.filter(s=>s.sid<sess.sid).map(s=>Object.values(s.P).find(x=>norm(x.name)===norm(p.name))&&s).filter(Boolean)[0];
    let dyn=""; if(prev){ const pp=Object.values(prev.P).find(x=>norm(x.name)===norm(p.name)); const pv=[...Array(10).keys()].filter(i=>!Q[i].vote&&pp.a[i]&&pp.a[i][2]).length; const d=ok-pv; dyn=(d>0?"▲ +"+d:d<0?"▼ "+d:"= 0")+" toʻgʻri ("+prev.date+")"; }
    return {name:p.name,av:p.av,score:p.score,ok,tot:graded.length,ans,all:sess.upto+1,spd:msn?(ms/msn/1000):null,weak,dyn}; }).sort((a,b)=>b.score-a.score);
  const perQ=graded.map(i=>{ const ps=Object.values(sess.P); const n=ps.length||1; const c=ps.filter(p=>p.a[i]&&p.a[i][2]).length; return {i,c,pct:Math.round(c/n*100)}; });

    ${rows.map((r,k)=>`<tr><td>${k+1}</td><td><img src="${AV(r.av)}"></td><td>${esc(r.name)}</td><td>${fmt(r.score)}</td><td>${r.ok}/${r.tot}</td><td>${r.ans}/${r.all}</td><td>${r.spd!=null?r.spd.toFixed(1)+" s":"—"}</td><td class="muted">${esc(r.weak.join(", "))||"✓ hammasi"}</td><td class="${r.dyn.startsWith("▲")?"up":r.dyn.startsWith("▼")?"dn":"muted"}">${esc(r.dyn)||"birinchi dars"}</td></tr>`).join("")}</table></div>
   <div class="card"><b>Soʻrovnoma (anonim)</b> · ${(s.fb||[]).length} ta javob · ${[4,3,2,1].map(r=>`${em[r]} ${fbR[r]}`).join(" &nbsp; ")}
    ${(s.fb||[]).filter(f=>f.t).map(f=>`<div class="fbitem">${em[f.r]||""} ${esc(f.t)}</div>`).join("")||'<div class="muted" style="margin-top:6px">Yozma fikr qoldirilmagan.</div>'}</div>`;
  $("#xcsv").onclick=()=>exportCSV(s,all); }
async function exportCSV(s,all){ if(!all) all=await loadHist(); if(!s) s=all.find(x=>x.sid===SID)||all[0]; if(!s){ toast("Tarix boʻsh"); return; }
  const {rows,perQ}=analyse(s,all); const q=v=>`"${String(v).replace(/"/g,'""')}"`;
  const L=[["#","Ism","Ball","Toʻgʻri javoblar","Javob berdi","Oʻrtacha tezlik (s)","Qiynalgan mavzular","Dinamika"].map(q).join(";")];
  rows.forEach((r,k)=>L.push([k+1,r.name,r.score,`${r.ok}/${r.tot}`,`${r.ans}/${r.all}`,r.spd!=null?r.spd.toFixed(1).replace(".",","):"",r.weak.join(", "),r.dyn].map(q).join(";")));
  L.push(""); L.push([q("Savol"),q("Mavzu"),q("Toʻgʻri %")].join(";")); perQ.forEach(x=>L.push([x.i+1,q(TOPIC[x.i]),x.pct].join(";")));
  const blob=new Blob(["﻿"+L.join("\r\n")],{type:"text/csv;charset=utf-8"}); const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`soliq_natija_${s.sid}.csv`; a.click(); toast("⬇ "+a.download); }
window.__host={go,get step(){return step},STEPS,computeScores};
}

/* ==========================================================================
   6) TELEFON (ISHTIROKCHI)
   ========================================================================== */
function phoneMain(){
document.body.className="ph";
$("#root").innerHTML=`<canvas id="prain"></canvas><div id="ph"></div>`;
const box=$("#ph");
if(!ROOM){ box.innerHTML=`<div class="hero"><div class="big">Xona topilmadi</div><div class="fact">Katta ekrandagi QR kodni qayta skanerlang.</div></div>`; return; }
const sst=(()=>{ try{ sessionStorage.setItem("_t","1"); return sessionStorage; }catch(e){ return {getItem:()=>null,setItem:()=>{}}; } })();
let PID=sst.getItem("soliq_pid_"+ROOM) || (DEMO?null:lsx.getItem("soliq_pid_"+ROOM)); if(!PID) PID="p"+Math.random().toString(36).slice(2,10);
sst.setItem("soliq_pid_"+ROOM,PID); if(!DEMO) lsx.setItem("soliq_pid_"+ROOM,PID);
let st=null, me=null, players={}, avs={}, myAns={}, results={}, myPoll=null, fbDone=false, view="", selAv=null, introT=null;
Store.on("state",v=>{ st=v; render(); });
Store.on("players/"+PID,v=>{ me=v; render(); });
Store.on("players",v=>{ players=v||{}; if(view.startsWith("rk")) { view=""; render(); } });
Store.on("avatars",v=>{ avs=v||{}; markTaken(); });
Store.on("answers",v=>{ myAns={}; Object.entries(v||{}).forEach(([i,a])=>{ if(a&&a[PID]) myAns[i]=a[PID]; }); render(); });
Store.on("results",v=>{ results=v||{}; render(); });
Store.on("poll/"+PID,v=>{ myPoll=v; render(); });
Store.on("fbDone/"+PID,v=>{ fbDone=!!v; render(); });

const rainC=$("#prain"); let rainOn=false;
function rain(lv){ lv=lv===true?2:lv===false?0:lv; rainOn=lv>0; rainC.style.display=lv?"block":"none"; rainC.style.opacity=lv===2?.55:.22;
  if(lv&&!rainC.__a){ rainC.__a=1; const c=rainC, x=c.getContext("2d"); let cols=[], fs=16; const CH2="0123456789%$ｱｲｳｴｵｶｷｸ";
    const rs=()=>{ const dpr=Math.min(2,devicePixelRatio||1); c.width=innerWidth*dpr; c.height=innerHeight*dpr; fs=16*dpr; cols=[...Array(Math.ceil(c.width/fs))].map(()=>({y:Math.random()*-c.height,v:(.35+Math.random()*.65)*fs*.55})); x.fillStyle="#020a04"; x.fillRect(0,0,c.width,c.height); };
    rs(); addEventListener("resize",rs);
    (function f(){ if(rainOn){ x.fillStyle="rgba(2,10,4,.10)"; x.fillRect(0,0,c.width,c.height); x.font=`${fs}px monospace`;
        cols.forEach((o,k)=>{ const ch=CH2[Math.random()*CH2.length|0]; x.fillStyle="rgba(210,255,220,.95)"; x.fillText(ch,k*fs,o.y);
          x.fillStyle="rgba(88,253,118,.85)"; x.fillText(CH2[Math.random()*CH2.length|0],k*fs,o.y-fs);
          o.y+=o.v; if(o.y>c.height+fs*4&&Math.random()>.96){ o.y=Math.random()*-200; o.v=(.35+Math.random()*.65)*fs*.55; } }); }
      setTimeout(()=>requestAnimationFrame(f),45); })(); } }
// "Katta ekranga qarang" — kod yomg'iridan yig'ilib, yana sochilib turadi
const LOOK_TXT="KATTA EKRANGA QARANG", GL="0123456789%$#@";
const look=(cls="")=>`<div class="look ${cls}" data-t="${LOOK_TXT}"></div>`;
setInterval(()=>{ const T=Date.now()/1000, cyc=6.0, ph=T%cyc;
  document.querySelectorAll(".look").forEach(e=>{ const t=e.dataset.t; let out="";
    for(let i=0;i<t.length;i++){ const ch=t[i]; if(ch===" "){ out+=" "; continue; }
      const tin=.15+i*.045, tout=4.3+i*.03;
      if(ph<tin) out+=Math.random()<.35?GL[Math.random()*GL.length|0]:" ";
      else if(ph<tin+.25) out+=GL[Math.random()*GL.length|0];
      else if(ph<tout) out+=ch;
      else if(ph<tout+.35) out+=GL[Math.random()*GL.length|0];
      else out+=Math.random()<.15?GL[Math.random()*GL.length|0]:" "; }
    e.textContent=out; }); },70);

const bar=()=>me?`<div class="pbar"><img src="${AV(me.av)}"><b>${esc(me.name)}</b><span class="sp"></span><span class="pts">${(me.score||0).toLocaleString("ru-RU")} ball</span></div>`:"";
const avHtml=(mood,bubble)=>`<div class="me ${mood||""}">${mood==="sad"?'<span class="cloud">🌧</span>':""}<img src="${AV(me.av)}"><span class="bub">${bubble||""}</span><span class="tear"></span></div>`;
function set(key,html){ if(view===key) return false; view=key; box.innerHTML=html; return true; }
function markTaken(){ $$(".av",box).forEach(e=>{ const n=+e.dataset.n, own=avs[n]; e.classList.toggle("taken", !!own && own!==PID); if(own&&own!==PID&&selAv===n){ selAv=null; e.classList.remove("sel"); const b=$("#jbtn"); if(b) b.disabled=true; } }); }
function sparks(){ const r=($(".me",box)||box).getBoundingClientRect(); for(let i=0;i<20;i++){ const e=document.createElement("div"); e.className="spark"; e.textContent=["⭐","✨","🪙","🎊"][i%4];
  e.style.left=(r.left+r.width/2)+"px"; e.style.top=(r.top+r.height/3)+"px"; e.style.setProperty("--dx",(Math.random()*260-130)+"px"); e.style.setProperty("--dy",(-60-Math.random()*220)+"px"); document.body.appendChild(e); setTimeout(()=>e.remove(),1300); } }
function rankOf(){ const r=Object.entries(players).filter(([,p])=>p&&p.name).sort((a,b)=>(b[1].score||0)-(a[1].score||0)||(a[1].joined||0)-(b[1].joined||0)); return [r.findIndex(([id])=>id===PID)+1, r.length]; }

function join(){ set("join",`<h2>Darsga qoʻshilish</h2><div class="muted">Ismingizni yozing va qahramon tanlang</div>
  <input class="inp" id="nm" maxlength="18" placeholder="Ismingiz" autocomplete="off">
  <div class="grid">${[...Array(30)].map((_,k)=>`<div class="av" data-n="${k+1}"><img src="${AV(k+1)}" style="animation-delay:${(-Math.random()*2.4).toFixed(2)}s"></div>`).join("")}</div>
  <div class="err" id="jerr"></div><button class="btn" id="jbtn" disabled>Qoʻshilish →</button>`);
  const chk=()=>{ $("#jbtn").disabled=!(selAv&&$("#nm").value.trim().length>=2); };
  $("#nm").oninput=chk; $("#nm").value=lsx.getItem("soliq_name")||"";
  $$(".av",box).forEach(e=>e.onclick=()=>{ $$(".av",box).forEach(x=>x.classList.remove("sel")); e.classList.add("sel"); selAv=+e.dataset.n; vib(20); chk(); });
  markTaken(); chk();
  $("#jbtn").onclick=async()=>{ const nm=$("#nm").value.trim().slice(0,18); $("#jbtn").disabled=true;
    const ok=await Store.claim("avatars/"+selAv,PID); if(!ok){ $("#jerr").textContent="Bu qahramonni boshqa kishi oldi — boshqasini tanlang"; selAv=null; markTaken(); return; }
    Object.entries(avs).forEach(([n,id])=>{ if(id===PID&&+n!==selAv) Store.set("avatars/"+n,null); });
    lsx.setItem("soliq_name",nm); await Store.set("players/"+PID,{name:nm,av:selAv,score:0,joined:Store.now()}); vib([30,40,30]); }; }

function render(){
  if(!st){ set("wait0",`<div class="hero"><div class="big">Ulanmoqda…</div></div>`); return; }
  if(!me||!me.name){ rain(false); if(view!=="join") join(); return; }
  const t=st.t;
  if(t!=="intro"){ clearInterval(introT); introT=null; }
  if(t==="lobby"){ rain(1); set("lobby",bar()+`<div class="hero">${avHtml("")}<div class="big">Siz qoʻshildingiz!</div><div class="fact">Dars hozir boshlanadi</div>${look()}</div>`); return; }
  if(t==="intro"){ if(!introT){ view=""; introT=setInterval(introTick,150); } introTick(); return; }
  if(t==="slide"||t==="pollrev"){ rain(1); const p=PH[st.n]||["",""];
    if(st.n===5){ set("s5",bar()+`<div class="hero"><div class="ring" style="animation:none;font-size:90px">🙋</div><div class="big">${esc(p[0])}</div><div class="fact">Javobni <b>ovoz chiqarib</b> ayting!<br>Kim birinchi?</div></div>`); return; }
    if(t==="pollrev"){ const ok=myPoll===POLL.a; set("pr"+(myPoll??"n"),bar()+`<div class="hero">${avHtml(myPoll==null?"":ok?"happy":"sad",ok?"🎯":"")}<div class="big">Toʻgʻri javob: ~1,6 trln soʻm</div><div class="fact">${myPoll==null?"Siz ovoz bermadingiz":ok?"Siz topdingiz! 🎉":"Siz: "+esc(POLL.o[myPoll])}</div></div>`); if(ok&&view==="pr"+myPoll) {} return; }
    set("sl"+st.n,bar()+`<div class="hero"><div class="glass hero" style="flex:0">${avHtml("")}<div class="big">${esc(p[0])}</div><div class="fact">${esc(p[1])}</div></div><div class="look" style="font-size:15px;opacity:.75">KATTA EKRANGA QARANG</div></div>`); return; }
  if(t==="poll"){ rain(false); if(myPoll!=null){ set("pv",bar()+`<div class="hero">${avHtml("")}<div class="big">Ovozingiz qabul qilindi ✓</div><div class="fact">${esc(POLL.o[myPoll])}</div><div class="muted">Natijani katta ekranda koʻramiz</div></div>`); return; }
    if(set("poll",bar()+`<div class="pq">${esc(POLL.q)}</div><div class="pbtns">${POLL.o.map((o,k)=>`<button class="pb p${k}" data-k="${k}"><span class="s">${SH[k]}</span>${esc(o)}</button>`).join("")}</div>`))
      $$(".pb",box).forEach(b=>b.onclick=()=>{ vib(25); Store.set("poll/"+PID,+b.dataset.k); }); return; }
  if(t==="q"){ rain(false); const i=st.i, q=Q[i], mine=myAns[i];
    if(mine){ set("qa"+i,bar()+`<div class="hero">${avHtml("")}<div class="big">Javob qabul qilindi ✓</div><div class="fact">${SH[mine.c]} ${esc(q.o[mine.c])}</div><div class="muted">Natijani kuting…</div></div>`); return; }
    const T=(q.sec||15)*1000;
    if(set("q"+i,bar()+`<div class="ptim"><i id="pti"></i></div><div class="pq">${i+1}. ${esc(q.q)}</div><div class="pbtns">${q.o.map((o,k)=>`<button class="pb p${k}" data-k="${k}"><span class="s">${SH[k]}</span>${esc(o)}</button>`).join("")}</div>`)){
      let sent=false;
      $$(".pb",box).forEach(b=>b.onclick=()=>{ if(sent) return; const ms=Store.now()-st.qStart; if(ms>T+800){ toast("⏰ Vaqt tugadi"); return; } sent=true; vib(25);
        $$(".pb",box).forEach(x=>x.classList.add("dim")); b.classList.remove("dim"); b.classList.add("mine"); Store.set("answers/"+i+"/"+PID,{c:+b.dataset.k,ms:Math.max(0,ms)}); });
      const tm=()=>{ const e=$("#pti"); if(!e||view!=="q"+i) return; const left=Math.max(0,T-(Store.now()-st.qStart)); e.style.width=(left/T*100)+"%"; e.style.background=left<5000?"#ff5c6c":"#58fd76"; if(left<=0){ $$(".pb",box).forEach(x=>x.classList.add("dim")); return; } requestAnimationFrame(tm); }; tm(); }
    return; }
  if(t==="rev"){ rain(false); const i=st.i, q=Q[i], r=(results[i]||{})[PID], mine=myAns[i];
    if(!results[i]){ set("rw"+i,bar()+`<div class="hero">${avHtml("")}<div class="big">Hisoblanmoqda…</div></div>`); return; }
    const ok=r&&r.ok, mood= q.vote ? (mine?"happy":"") : ok?"happy":"sad";
    const title= q.vote ? (mine?"Hazil savol — hammaga +500 😄":"Javob bermadingiz") : ok?"Toʻgʻri! 🎉":mine?"Afsus, notoʻgʻri":"Vaqt tugadi ⏰";
    if(set("rv"+i,bar()+`<div class="hero">${avHtml(mood,mood==="happy"?"🎉":"")}<div class="big">${title}</div><div class="fact">${r?`<b style="color:var(--w);font-size:28px">+${r.pts}</b> ball`:"+0 ball"}</div><div class="muted">Katta ekranga qarang — izoh oʻsha yerda</div></div>`)){
      if(mood==="happy"){ sparks(); vib([30,40,30]); } else if(mood==="sad") vib(120); }
    return; }
  if(t==="lb"||t==="final"){ rain(false); const [rk,n]=rankOf();
    set("rk"+t+st.i+"_"+rk+"_"+(me.score||0),bar()+`<div class="hero">${avHtml(rk<=3?"happy":"",rk===1?"👑":rk<=3?"🏅":"")}<div class="muted">${t==="final"?"Yakuniy natija":(st.i+1)+" ta savoldan keyin"}</div><div class="rk">${rk}-oʻrin</div><div class="fact">${n} kishi ichida · ${(me.score||0).toLocaleString("ru-RU")} ball</div></div>`); return; }
  if(t==="endring"){ const ra=st.ringAt; const e=ra?(Store.now()-ra)/1000:-1; if(!thxT) thxT=setInterval(()=>{ if(st&&st.t==="endring") render(); else { clearInterval(thxT); thxT=null; } },250);
    const k=END_RINGS.findIndex(r=>e>=r&&e<r+1.6);
    if(k>=0){ rain(1); if(!rung["end"+ra+k]){ rung["end"+ra+k]=1; vib([500,150,500,150,300]); } set("er"+k,`<div class="hero"><div class="ring">📞</div><div class="big">Qoʻngʻiroq…</div>${look()}</div>`); }
    else { rain(2); set("ew",`<div class="hero">${look("big2")}</div>`); } return; }
  if(t==="thx"&&!fbDone&&Store.now()-st.ts<FORM_DELAY*1000){ if(!thxT) thxT=setInterval(()=>{ if(st&&st.t==="thx") render(); else { clearInterval(thxT); thxT=null; } },500);
    rain(2); set("thx0",`<div class="hero"><div class="glass hero" style="flex:0">${avHtml("happy","👏")}<div class="big" style="color:var(--g)">Eʼtiboringiz uchun rahmat!</div></div>${look()}</div>`); return; }
  if(t==="fb"||t==="thx"){ clearInterval(thxT); thxT=null; rain(false); if(fbDone){ set("fbd",bar()+`<div class="hero">${avHtml("happy","💚")}<div class="big">Rahmat! 🙏</div><div class="fact">Fikringiz qabul qilindi</div></div>`); return; }
    if(set("fb",bar()+(t==="thx"?`<div class="muted" style="color:var(--g);font-weight:700;font-size:17px">Eʼtiboringiz uchun rahmat! 💚</div>`:"")+`<h2>Dars sizga yoqdimi?</h2><div class="muted">Ismingiz koʻrinmaydi — anonim</div>
      <div class="rate">${[[4,"😍"],[3,"😊"],[2,"😐"],[1,"😕"]].map(([v,e])=>`<button data-r="${v}">${e}</button>`).join("")}</div>
      <textarea class="inp" id="fbt" maxlength="500" placeholder="Taklif yoki shikoyatingiz boʻlsa, bemalol yozib qoldiring — keyingi darslar yanada yaxshi boʻlishiga sababchi boʻlasiz 🙏"></textarea>
      <button class="btn" id="fbb" disabled>Yuborish</button>`)){
      let r=0; $$(".rate button",box).forEach(b=>b.onclick=()=>{ $$(".rate button",box).forEach(x=>x.classList.remove("sel")); b.classList.add("sel"); r=+b.dataset.r; $("#fbb").disabled=false; vib(20); });
      $("#fbb").onclick=async()=>{ if(!r) return; $("#fbb").disabled=true; await Store.push("fb",{r,t:$("#fbt").value.trim().slice(0,500)}); await Store.set("fbDone/"+PID,1); }; }
    return; }
}
let rung={}, thxT=null;
function introTick(){ if(!st||st.t!=="intro"){ clearInterval(introT); introT=null; return; }
  const s=st.introStart; if(!s){ rain(2); set("i0",`<div class="hero">${look("big2")}</div>`); return; }
  const t=(Store.now()-s)/1000; let ring=-1; RINGS.forEach(([r,l],k)=>{ if(t>=r&&t<r+l) ring=k; });
  if(ring>=0){ rain(1); if(!rung[s+"_"+ring]){ rung[s+"_"+ring]=1; vib(ring===3?[400,100,350]:[500,150,500,150,300]); } set("ir",`<div class="hero"><div class="ring">📞</div><div class="big">Qoʻngʻiroq…</div>${look()}</div>`); return; }
  rain(2); set("iw",`<div class="hero">${look("big2")}</div>`); }
}
</script>
